name: Manter Supabase Ativo

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 da manhã no Brasil)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Executar transacao ativa no Supabase
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          
          # Realiza leitura direta para acordar o pool
          HTTP_GET=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${URL}/rest/v1/config?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            
          echo "Leitura REST HTTP: $HTTP_GET"

          # Se o status for de sucesso (200-399), finaliza com êxito
          if [ "$HTTP_GET" -ge 200 ] && [ "$HTTP_GET" -lt 400 ]; then
            echo "Ping realizado com sucesso!"
            exit 0
          else
            echo "Falha ao comunicar com o Supabase. Status: $HTTP_GET"
            exit 1
          fi
