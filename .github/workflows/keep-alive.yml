name: Manter Supabase Ativo

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 no Brasil)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Ping na API do Supabase
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${URL}/rest/v1/config?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Status Supabase: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping realizado com sucesso!"
          else
            echo "Erro na conexao com Supabase (HTTP $STATUS)"
            exit 1
          fi

      - name: Manter repositorio ativo (previne desativacao dos 60 dias)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Registra a data do ping no arquivo de batimento
          echo "Ultimo ping: $(date -u)" > .github/heartbeat.txt
          
          git add .github/heartbeat.txt
          # Só faz commit se houver alteração
          if ! git diff --staged --quiet; then
            git commit -m "chore: heartbeat keep-alive [skip ci]"
            git push
          fi
